<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>20일 보석기도 선포기도문 받기</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 8% 0%, rgba(219, 199, 255, 0.62), transparent 34%),
          radial-gradient(circle at 100% 4%, rgba(255, 246, 218, 0.88), transparent 34%),
          #fffaf2;
        color: #2f251f;
        font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        border-bottom: 1px solid rgba(139, 94, 52, 0.16);
        background: rgba(255, 250, 242, 0.94);
        backdrop-filter: blur(14px);
        padding: 18px 16px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 1.42rem;
        font-weight: 950;
      }

      header p {
        margin: 8px auto 0;
        max-width: 28rem;
        color: #7d5a39;
        font-size: 0.92rem;
        font-weight: 800;
        line-height: 1.5;
      }

      main {
        display: grid;
        gap: 18px;
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 18px 14px 40px;
      }

      article {
        overflow: hidden;
        border: 1px solid rgba(139, 94, 52, 0.14);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: 0 14px 34px rgba(82, 58, 30, 0.1);
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 14px 12px;
      }

      .day {
        color: #8b5e34;
        font-size: 1rem;
        font-weight: 950;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      a {
        color: inherit;
      }

      button {
        border: 0;
        font: inherit;
      }

      .button {
        border-radius: 999px;
        background: #2f251f;
        color: #fff;
        padding: 9px 13px;
        text-decoration: none;
        font-size: 0.82rem;
        font-weight: 950;
        white-space: nowrap;
      }

      .button.secondary {
        background: #f3eadc;
        color: #7d552e;
      }

      .image-button {
        display: block;
        width: 100%;
        margin: 0;
        padding: 0;
        background: white;
        cursor: pointer;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border-top: 1px solid rgba(139, 94, 52, 0.08);
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        background: rgba(0, 0, 0, 0.72);
        padding: 12px;
      }

      .modal.open {
        display: block;
      }

      .modal-panel {
        display: flex;
        width: min(100%, 720px);
        height: 100%;
        margin: 0 auto;
        overflow: hidden;
        flex-direction: column;
        border-radius: 24px;
        background: #fffaf2;
      }

      .modal-head,
      .modal-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px;
      }

      .modal-body {
        flex: 1;
        overflow: auto;
        background: white;
      }

      .modal-body img {
        border-top: 0;
      }

      footer {
        padding: 0 16px 30px;
        color: #8a7a68;
        text-align: center;
        font-size: 0.82rem;
        font-weight: 800;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>20일 보석기도 선포기도문</h1>
      <p>이미지를 누르거나 저장 버튼을 눌러 소장해 주세요. 휴대폰에서는 이미지가 열린 뒤 길게 눌러 저장할 수도 있어요.</p>
    </header>
    <main id="list"></main>
    <footer>용문교회 유치부 · 20일 보석기도</footer>
    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-panel">
        <div class="modal-head">
          <strong id="modalTitle">선포기도문</strong>
          <button class="button secondary" type="button" id="closeModal">닫기</button>
        </div>
        <div class="modal-body">
          <img id="modalImage" alt="" />
        </div>
        <div class="modal-foot">
          <span style="font-size: 0.78rem; font-weight: 800; color: #8a7a68;">저장이 안 되면 이미지를 길게 눌러 저장해 주세요.</span>
          <button class="button" type="button" id="saveModal">큰글씨 저장</button>
        </div>
      </div>
    </div>
    <script>
      const list = document.querySelector('#list')
      const modal = document.querySelector('#modal')
      const modalTitle = document.querySelector('#modalTitle')
      const modalImage = document.querySelector('#modalImage')
      const closeModal = document.querySelector('#closeModal')
      const saveModal = document.querySelector('#saveModal')
      const days = Array.from({ length: 20 }, (_, index) => String(index + 1).padStart(2, '0'))
      let selected = null

      list.innerHTML = days
        .map((day) => {
          const src = `/images/prayer-downloads/declarations/day-${day}-declaration.png?v=20260721-large`
          return `
            <article>
              <div class="card-head">
                <div class="day">${Number(day)}일차 선포기도문</div>
                <div class="actions">
                  <button class="button secondary" type="button" data-preview="${src}" data-title="${Number(day)}일차 선포기도문" data-file="${day}-선포기도문.png">크게 보기</button>
                  <button class="button" type="button" data-save="${src}" data-file="${day}-선포기도문.png">큰글씨 저장</button>
                </div>
              </div>
              <button class="image-button" type="button" data-preview="${src}" data-title="${Number(day)}일차 선포기도문" data-file="${day}-선포기도문.png">
                <img src="${src}" alt="${Number(day)}일차 선포기도문" loading="lazy" />
              </button>
            </article>
          `
        })
        .join('')

      list.addEventListener('click', async (event) => {
        event.preventDefault()
        const target = event.target instanceof Element ? event.target : null
        const preview = target?.closest('[data-preview]')
        const save = target?.closest('[data-save]')
        if (!preview && !save) return
        if (preview) {
          selected = { src: preview.dataset.preview, file: preview.dataset.file, title: preview.dataset.title }
          modalTitle.textContent = selected.title
          modalImage.removeAttribute('src')
          modal.classList.add('open')
          modal.setAttribute('aria-hidden', 'false')
          modalImage.src = URL.createObjectURL(await createLargeImageBlob(selected.src))
        }
        if (save) {
          await saveLargeImage(save.dataset.save, save.dataset.file)
        }
      })

      closeModal.addEventListener('click', () => {
        modal.classList.remove('open')
        modal.setAttribute('aria-hidden', 'true')
        if (modalImage.src.startsWith('blob:')) URL.revokeObjectURL(modalImage.src)
        modalImage.removeAttribute('src')
      })

      saveModal.addEventListener('click', async () => {
        if (selected) await saveLargeImage(selected.src, selected.file)
      })

      async function saveLargeImage(src, fileName) {
        const blob = await createLargeImageBlob(src)
        const url = URL.createObjectURL(blob)
        const link = document.createElement('a')
        link.href = url
        link.download = fileName
        link.click()
        URL.revokeObjectURL(url)
      }

      async function createLargeImageBlob(src) {
        const image = await loadImage(src)
        const cropX = Math.round(image.naturalWidth * 0.075)
        const cropY = Math.round(image.naturalWidth * 0.075)
        const cropWidth = image.naturalWidth - cropX * 2
        const cropHeight = image.naturalHeight - cropY * 2
        const canvas = document.createElement('canvas')
        canvas.width = 1080
        canvas.height = Math.round((cropHeight / cropWidth) * canvas.width)
        const ctx = canvas.getContext('2d')
        ctx.drawImage(image, cropX, cropY, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height)
        return new Promise((resolve, reject) => canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('fail'))), 'image/png'))
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const image = new Image()
          image.onload = () => resolve(image)
          image.onerror = reject
          image.src = src
        })
      }
    </script>
  </body>
</html>
