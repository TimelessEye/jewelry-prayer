<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>20일 보석기도 큰글씨 자료</title>
    <style>
      :root {
        color: #2d241f;
        background: #fffaf2;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 8% 0%, rgba(219, 199, 255, 0.62), transparent 34%),
          radial-gradient(circle at 100% 4%, rgba(255, 246, 218, 0.88), transparent 34%),
          #fffaf2;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid rgba(139, 94, 52, 0.15);
        background: rgba(255, 250, 242, 0.96);
        padding: 18px 14px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(45, 36, 31, 0.08);
      }

      h1 {
        margin: 0;
        font-size: 1.45rem;
        font-weight: 900;
      }

      header p {
        margin: 8px auto 0;
        max-width: 430px;
        color: #8b5e34;
        font-size: 0.95rem;
        font-weight: 800;
        line-height: 1.55;
      }

      main {
        display: grid;
        gap: 18px;
        width: min(100%, 920px);
        margin: 0 auto;
        padding: 18px 12px 48px;
      }

      article {
        overflow: hidden;
        border: 1px solid rgba(139, 94, 52, 0.15);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 45px rgba(45, 36, 31, 0.1);
      }

      .day-head {
        border-bottom: 1px solid rgba(139, 94, 52, 0.12);
        padding: 14px 16px;
      }

      h2 {
        margin: 0;
        color: #8b5e34;
        font-size: 1.08rem;
        font-weight: 900;
      }

      .pair {
        display: grid;
        gap: 12px;
        padding: 12px;
      }

      .item {
        overflow: hidden;
        border: 1px solid rgba(139, 94, 52, 0.12);
        border-radius: 18px;
        background: #fff;
      }

      .item-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px;
      }

      h3 {
        margin: 0;
        color: #8b5e34;
        font-size: 0.92rem;
        font-weight: 900;
      }

      .actions {
        display: flex;
        flex-shrink: 0;
        gap: 7px;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 9px 12px;
        font: inherit;
        font-size: 0.78rem;
        font-weight: 900;
        cursor: pointer;
      }

      .secondary {
        background: #f6ead4;
        color: #8b5e34;
      }

      .primary {
        background: #2d241f;
        color: #fff;
      }

      .image-button {
        display: block;
        width: 100%;
        border-top: 1px solid rgba(139, 94, 52, 0.1);
        border-radius: 0;
        padding: 0;
        background: #fff;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        background: rgba(0, 0, 0, 0.72);
        padding: 12px;
      }

      .modal.open {
        display: block;
      }

      .modal-card {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        width: min(100%, 760px);
        height: 100%;
        margin: 0 auto;
        border-radius: 24px;
        background: #fffaf2;
      }

      .modal-head,
      .modal-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid rgba(139, 94, 52, 0.15);
        padding: 12px;
      }

      .modal-foot {
        display: grid;
        border-top: 1px solid rgba(139, 94, 52, 0.15);
        border-bottom: 0;
      }

      .modal-body {
        flex: 1;
        overflow: auto;
        background: #fff;
      }

      @media (min-width: 720px) {
        .pair {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>20일 보석기도 큰글씨 자료</h1>
      <p>날짜별로 기도문과 선포기도문을 짝꿍으로 저장해 주세요.</p>
    </header>
    <main id="list"></main>

    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-head">
          <strong id="modalTitle"></strong>
          <button class="secondary" type="button" id="closeModal">닫기</button>
        </div>
        <div class="modal-body">
          <img id="modalImage" alt="" />
        </div>
        <div class="modal-foot">
          <button class="primary" type="button" id="saveModal">이 이미지 저장하기</button>
          <span style="text-align: center; font-size: 0.78rem; font-weight: 800; color: #8a7a68;">저장이 안 되면 이미지를 길게 눌러 저장해 주세요.</span>
        </div>
      </div>
    </div>

    <script>
      const list = document.querySelector("#list")
      const modal = document.querySelector("#modal")
      const modalTitle = document.querySelector("#modalTitle")
      const modalImage = document.querySelector("#modalImage")
      const closeModal = document.querySelector("#closeModal")
      const saveModal = document.querySelector("#saveModal")
      const days = Array.from({ length: 20 }, (_, index) => String(index + 1).padStart(2, "0"))
      let selected = null

      function makeItem(day, kind) {
        const isDeclaration = kind === "declaration"
        const label = isDeclaration ? "선포기도문" : "기도문"
        const order = isDeclaration ? "2" : "1"
        const folder = isDeclaration ? "declarations" : "prayers"
        const suffix = isDeclaration ? "declaration" : "prayer"
        return {
          src: `/downloads/20260721-large-v2/${folder}/day-${day}-${suffix}-large.png?v=20260721-large-v2`,
          title: `${Number(day)}일차 ${label}`,
          file: `${day}-${order}-${label}-큰글씨.png`,
        }
      }

      list.innerHTML = days
        .map((day) => {
          const prayer = makeItem(day, "prayer")
          const declaration = makeItem(day, "declaration")
          return `
            <article>
              <div class="day-head"><h2>${Number(day)}일차</h2></div>
              <div class="pair">
                ${renderItem(prayer)}
                ${renderItem(declaration)}
              </div>
            </article>
          `
        })
        .join("")

      function renderItem(item) {
        return `
          <section class="item">
            <div class="item-head">
              <h3>${item.title}</h3>
              <div class="actions">
                <button class="secondary" type="button" data-preview="${item.src}" data-title="${item.title}" data-file="${item.file}">크게 보기</button>
                <button class="primary" type="button" data-save="${item.src}" data-file="${item.file}">저장</button>
              </div>
            </div>
            <button class="image-button" type="button" data-preview="${item.src}" data-title="${item.title}" data-file="${item.file}">
              <img src="${item.src}" alt="${item.title}" loading="lazy" />
            </button>
          </section>
        `
      }

      list.addEventListener("click", (event) => {
        event.preventDefault()
        const target = event.target instanceof Element ? event.target : null
        const preview = target?.closest("[data-preview]")
        const save = target?.closest("[data-save]")
        if (preview) {
          selected = { src: preview.dataset.preview, file: preview.dataset.file, title: preview.dataset.title }
          modalTitle.textContent = selected.title
          modalImage.src = selected.src
          modal.classList.add("open")
          modal.setAttribute("aria-hidden", "false")
        }
        if (save) {
          saveImage(save.dataset.save, save.dataset.file)
        }
      })

      closeModal.addEventListener("click", () => {
        modal.classList.remove("open")
        modal.setAttribute("aria-hidden", "true")
        modalImage.removeAttribute("src")
      })

      saveModal.addEventListener("click", () => {
        if (selected) saveImage(selected.src, selected.file)
      })

      function saveImage(src, fileName) {
        const link = document.createElement("a")
        link.href = src
        link.download = fileName
        link.click()
      }
    </script>
  </body>
</html>
